services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_data_analyst
      POSTGRES_USER: analyst
      POSTGRES_PASSWORD: analyst
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyst -d ai_data_analyst"]
      interval: 5s
      timeout: 3s
      retries: 20
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama-data:/root/.ollama]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://analyst:analyst@postgres:5432/ai_data_analyst
      DATA_DIR: /data
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:9b
      MAX_UPLOAD_BYTES: "104857600"
    volumes: [uploads:/data]
    depends_on:
      postgres: { condition: service_healthy }
      ollama: { condition: service_started }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]
volumes:
  postgres-data:
  ollama-data:
  uploads:
