[project]
name = "ai-data-analyst-api"
version = "0.1.0"
description = "FastAPI backend for the AI Data Analyst"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "ollama>=0.6",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
